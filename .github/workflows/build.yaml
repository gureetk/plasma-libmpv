name: Build libmpv-android

# Plasma's build: the full build is slow (every dependency, four ABIs), so it
# runs only for pull requests that change what goes into the AAR, and by hand.
# Releases are built by publish.yaml.
on:
  pull_request:
    paths:
      - buildscripts/**
      - libmpv/**
      - gradle/**
      - '*.gradle.kts'
      - gradle.properties
      - gradlew
      - .github/workflows/build.yaml
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip python3-jinja2 gperf nasm
          sudo pip3 install --break-system-packages meson

      # The dependencies' sources, as download.sh fetches them. Saved before
      # patching and building, so the cache holds clean sources only.
      - name: Restore dependency sources
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: buildscripts/deps
          key: deps-${{ hashFiles('buildscripts/include/depinfo.sh', 'buildscripts/include/download-deps.sh') }}

      - name: Download dependencies
        working-directory: ./buildscripts
        env:
          IN_CI: 1
        run: ./download.sh

      - name: Save dependency sources
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: buildscripts/deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # Fails in a minute, rather than after the native build, if the Gradle
      # build itself is broken, and shows the coordinates in the log
      - name: Check the Gradle build
        run: |
          ./gradlew :libmpv:generatePomFileForMavenPublication
          cat libmpv/build/publications/maven/pom-default.xml

      - name: Apply patches
        working-directory: ./buildscripts
        run: ./patch.sh

      - name: Build
        working-directory: ./buildscripts
        run: ./build.sh

      - name: Check FFmpeg in the AAR
        working-directory: ./buildscripts
        run: ./check-aar.sh

      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-release.aar
          path: ./libmpv/build/outputs/aar/libmpv-release.aar
