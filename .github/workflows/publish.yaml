name: Publish

# Plasma's build: builds the AAR and publishes it on this repository's
# releases page as libmpv-<version>.aar with SHA256SUMS, under the tag
# v<libmpvVersion> from gradle.properties. Either push that tag, or run this
# workflow by hand on main (Actions › Publish › Run workflow), and it makes
# the tag itself, at the commit it built. Nothing goes to Maven Central.

on:
  push:
    tags:
      - v*
  workflow_dispatch:

# One release at a time, so two runs can't both make the same one
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Before the long build: the tag is v<libmpvVersion> from
      # gradle.properties, and that version has to start with mpv's. A run by
      # hand makes the tag, so it has to be on main and the tag must not exist.
      - name: Check the tag
        run: |
          version=$(sed -n 's/^libmpvVersion=//p' gradle.properties)
          . buildscripts/include/depinfo.sh
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run it on main, not $GITHUB_REF_NAME"
              exit 1
            fi
            found=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || found=$?
            if [ "$found" -eq 0 ]; then
              echo "::error::$tag already exists. For a new release, raise libmpvVersion in gradle.properties."
              exit 1
            elif [ "$found" -ne 2 ]; then
              echo "::error::Couldn't check whether $tag exists"
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match libmpvVersion=$version in gradle.properties"
            exit 1
          fi
          case "$version" in
            "$v_mpv"-plasma.*) ;;
            *)
              echo "::error::libmpvVersion=$version doesn't start with mpv's version ($v_mpv-plasma.)"
              exit 1
              ;;
          esac
          {
            echo "VERSION=$version"
            echo "TAG=$tag"
            echo "MPV_VERSION=$v_mpv"
            echo "FFMPEG_VERSION=$v_ffmpeg"
          } >> "$GITHUB_ENV"

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip python3-jinja2 gperf nasm
          sudo pip3 install --break-system-packages meson

      - name: Download dependencies
        working-directory: ./buildscripts
        env:
          IN_CI: 1
        run: ./download.sh

      - name: Apply patches
        working-directory: ./buildscripts
        run: ./patch.sh

      - name: Build
        working-directory: ./buildscripts
        run: ./build.sh

      - name: Check FFmpeg in the AAR
        working-directory: ./buildscripts
        run: ./check-aar.sh

      - name: Prepare the release files
        run: |
          mkdir release
          cp libmpv/build/outputs/aar/libmpv-release.aar "release/libmpv-$VERSION.aar"
          .github/scripts/ivy-xml.sh "$VERSION" > "release/ivy-$VERSION.xml"
          (cd release && sha256sum "libmpv-$VERSION.aar" "ivy-$VERSION.xml" > SHA256SUMS && cat SHA256SUMS)
          {
            echo "mpv $MPV_VERSION and FFmpeg $FFMPEG_VERSION, built for Plasma."
            echo
            echo "What differs from upstream's build is in the [README](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/README.md). \`SHA256SUMS\` has the AAR's SHA-256."
          } > release-notes.md

      # Makes the tag at the commit built, when the run was started by hand
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: |
            release/libmpv-${{ env.VERSION }}.aar
            release/ivy-${{ env.VERSION }}.xml
            release/SHA256SUMS
